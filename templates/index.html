<!-- 3D Fake News Detection -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#141e30,#243b55);
            overflow:hidden;
        }

        /* 3D CARD */

        #n1{
            width:450px;
            padding:35px;
            border-radius:25px;

            background:rgba(255,255,255,0.1);

            backdrop-filter:blur(15px);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.5),
                inset 0 0 10px rgba(255,255,255,0.2);

            transform-style:preserve-3d;

            transform:
                perspective(1000px)
                rotateX(8deg);

            transition:0.5s;
        }

        #n1:hover{
            transform:
                perspective(1000px)
                rotateX(0deg)
                scale(1.03);
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:20px;

            text-shadow:0 0 15px cyan;
        }

        p{
            text-align:center;
            color:#ddd;
            margin-bottom:20px;
            line-height:1.5;
        }

        label{
            color:white;
            font-size:18px;
            font-weight:bold;
        }

        input[type="text"]{

            width:100%;
            padding:15px;
            margin-top:10px;
            margin-bottom:20px;

            border:none;
            border-radius:15px;

            font-size:16px;

            outline:none;

            background:rgba(255,255,255,0.2);

            color:white;

            box-shadow:
                inset 2px 2px 5px rgba(0,0,0,0.3),
                inset -2px -2px 5px rgba(255,255,255,0.1);
        }

        input::placeholder{
            color:#ddd;
        }

        input[type="submit"]{

            width:100%;
            padding:15px;

            border:none;
            border-radius:15px;

            background:
                linear-gradient(45deg,#00c6ff,#0072ff);

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.4s;

            box-shadow:
                0 8px 15px rgba(0,114,255,0.5);
        }

        input[type="submit"]:hover{

            transform:translateY(-3px);

            box-shadow:
                0 12px 20px rgba(0,114,255,0.8);
        }

        .stats-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .stats-link:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <div id="n1">

        <h1>📰 Fake News Detection</h1>

        <p>
            In a world where misinformation spreads rapidly,
            our smart AI-powered tool helps identify fake news.
        </p>

        <form action="/news" method="POST">

            <label for="news-input">
                Enter News Headline:
            </label>

            <input
                type="text"
                id="news-input"
                name="news"
                placeholder="Enter news headline here..."
                required>

            <input
                type="submit"
                value="Detect Fake News">

        </form>
        <div style="color:white; text-align:center;">

            <h2>{{ prediction }}</h2>

            <p>{{ headline }}</p>

         </div>
         {% if accuracy %}

        <h2
        style="
        color:white;
        margin-top:20px;
        text-align:center;
        "
        >

        Model Accuracy : {{ accuracy }}%

        </h2>

        <div style="text-align: center;">
            <a href="/stats" class="stats-link">📊 View Statistics & Graphs</a>
        </div>

        {% endif %}
    </div>

</body>
</html>
